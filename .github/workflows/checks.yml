name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  linux-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - name: Build against available distribution headers
        shell: bash
        run: |
          kdir=$(find /usr/src -maxdepth 1 -name 'linux-headers-*-generic' -type d | sort -V | tail -n1)
          test -n "$kdir"
          make -C linux check
          make -C linux KDIR="$kdir"
