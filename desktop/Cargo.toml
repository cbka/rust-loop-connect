[package]
name = "ek-loop-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Native EK Loop Connect controller for Linux and Windows"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
fs2 = "0.4"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(target_os = "windows")'.dependencies]
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
